version: '3.8'

services:
  whisper-service:
    build: .
    container_name: whisper-service
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - MAX_SESSIONS=${MAX_SESSIONS:-5}
      - SESSION_TTL=${SESSION_TTL:-600}
      - BUFFER_OVERLAP_SECONDS=${BUFFER_OVERLAP_SECONDS:-2.0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - PORT=8000
    volumes:
      - ./models:/root/.cache/whisper  # Cache Whisper models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Give time for model to load

  redis:
    image: redis:7-alpine
    container_name: whisper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis-data:

